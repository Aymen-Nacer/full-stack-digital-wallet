version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: digital_wallet_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: digital_wallet
      MYSQL_USER: wallet_user
      MYSQL_PASSWORD: wallet_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digital_wallet_app
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "Digital Wallet"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      APP_KEY: base64:c2VjdXJlLWRlbW8ta2V5LTMyLWJ5dGVzISEh
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: digital_wallet
      DB_USERNAME: wallet_user
      DB_PASSWORD: wallet_pass
      LOG_CHANNEL: stderr
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digital_wallet_frontend
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  mysql_data:
